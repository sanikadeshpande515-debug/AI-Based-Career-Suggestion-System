<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gradHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradPres" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EFF6FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DBEAFE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradEngine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FEF3C7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FDE68A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradData" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ECFDF5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D1FAE5;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="500" rx="16" fill="#F8FAFC"/>

  <!-- Title Header Banner -->
  <rect x="20" y="20" width="760" height="60" rx="10" fill="url(#gradHeader)" filter="url(#shadow)"/>
  <text x="400" y="55" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    AI-Based Career Suggestion System: Three-Layer Architecture
  </text>

  <!-- LAYER 1: Presentation Layer -->
  <rect x="40" y="105" width="720" height="95" rx="12" fill="url(#gradPres)" stroke="#93C5FD" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="130" fill="#1E40AF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">LAYER 1: PRESENTATION LAYER (Streamlit Web Interface)</text>
  <rect x="60" y="142" width="150" height="42" rx="6" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="135" y="167" fill="#1F2937" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">User Input Form</text>
  <rect x="230" y="142" width="150" height="42" rx="6" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="305" y="167" fill="#1F2937" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Input Validation UI</text>
  <rect x="400" y="142" width="160" height="42" rx="6" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="480" y="167" fill="#1F2937" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Match Score Cards (%)</text>
  <rect x="580" y="142" width="160" height="42" rx="6" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="660" y="167" fill="#1F2937" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Explanation Display</text>

  <!-- Arrow Down 1 -->
  <path d="M 400 200 L 400 230" stroke="#3B82F6" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="4"/>
  <polygon points="400,234 394,222 406,222" fill="#3B82F6"/>

  <!-- LAYER 2: Rule-Based Engine Layer -->
  <rect x="40" y="235" width="720" height="115" rx="12" fill="url(#gradEngine)" stroke="#FCD34D" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="260" fill="#92400E" font-family="system-ui, sans-serif" font-size="14" font-weight="700">LAYER 2: RULE-BASED ENGINE LAYER (Knowledge-Driven AI Logic)</text>
  
  <rect x="60" y="272" width="200" height="62" rx="6" fill="#FFFFFF" stroke="#FDE68A"/>
  <text x="160" y="295" fill="#92400E" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Production Rules R1-R6</text>
  <text x="160" y="315" fill="#4B5563" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Skills(+3), Interests(+2), etc.</text>

  <rect x="280" y="272" width="200" height="62" rx="6" fill="#FFFFFF" stroke="#FDE68A"/>
  <text x="380" y="295" fill="#92400E" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Weighted Scoring Engine</text>
  <text x="380" y="315" fill="#4B5563" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Score(c) = Σ w_i · I_i ≤ 11</text>

  <rect x="500" y="272" width="240" height="62" rx="6" fill="#FFFFFF" stroke="#FDE68A"/>
  <text x="620" y="295" fill="#92400E" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Ranking &amp; Reason Generator</text>
  <text x="620" y="315" fill="#4B5563" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Deterministic Sorting (Top 5)</text>

  <!-- Arrow Down 2 -->
  <path d="M 400 350 L 400 378" stroke="#D97706" stroke-width="3" stroke-dasharray="4"/>
  <polygon points="400,382 394,370 406,370" fill="#D97706"/>

  <!-- LAYER 3: Data Layer -->
  <rect x="40" y="385" width="720" height="90" rx="12" fill="url(#gradData)" stroke="#6EE7B7" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="410" fill="#065F46" font-family="system-ui, sans-serif" font-size="14" font-weight="700">LAYER 3: DATA LAYER (Knowledge Base &amp; CSV Access)</text>
  <rect x="60" y="420" width="210" height="42" rx="6" fill="#FFFFFF" stroke="#A7F3D0"/>
  <text x="165" y="445" fill="#1F2937" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">careers.csv Knowledge Base</text>
  <rect x="290" y="420" width="200" height="42" rx="6" fill="#FFFFFF" stroke="#A7F3D0"/>
  <text x="390" y="445" fill="#1F2937" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">CSV Loader (load_careers)</text>
  <rect x="510" y="420" width="230" height="42" rx="6" fill="#FFFFFF" stroke="#A7F3D0"/>
  <text x="625" y="445" fill="#1F2937" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Option Extractor (get_options)</text>
</svg>
